<style>
:root{
  --panel:#021762; --panel-hi:#0C2A86; --panel-lo:#010E45; --brand:#248C95; --brand-hi:#45B3BD; --panel-line:rgba(244,243,238,.16);
  --plate:#F4F3EE; --plate-2:#E8E6DE; --plate-line:#CFCCC1;
  --ink:#15171A; --ink-2:#4A4E56; --ink-3:#6B6F77;
  --on-panel:#F4F3EE; --on-panel-2:#AFC0D6;
  --now:#DFF04A; --danger:#A8261C; --danger-bg:#F6E3DF;
  --r:5px; --row:36px;
  --f:'Barlow',system-ui,sans-serif; --fc:'Barlow Condensed','Barlow',system-ui,sans-serif;
  --shadow:0 1px 0 rgba(0,0,0,.22),0 4px 10px -3px rgba(0,0,0,.38);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--panel);color:var(--on-panel);font-family:var(--f);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;min-height:100dvh}
::selection{background:var(--on-panel-2);color:var(--ink)}
*{scrollbar-width:thin;scrollbar-color:var(--panel-hi) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--panel-hi);border-radius:10px;border:2px solid var(--panel)}
:focus-visible{outline:2px solid var(--on-panel);outline-offset:2px}
.plate :focus-visible,.sheet :focus-visible{outline-color:var(--ink)}
.plate:focus-visible,.slot:focus-visible,.pad-num button:focus-visible{outline-color:var(--on-panel)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input,select{caret-color:var(--ink)}
.hidden{display:none!important}
.cond{font-family:var(--fc)}
.num{font-variant-numeric:tabular-nums}

/* ---------- barra ---------- */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:20px;padding:8px 20px;
  background:var(--panel-lo);border-bottom:2px solid var(--brand)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fc);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.brand svg{flex:none}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--on-panel-2);padding:9px 14px;border-radius:var(--r);
  font-family:var(--fc);font-weight:600;font-size:17px;letter-spacing:.03em;text-transform:uppercase;transition:background .18s var(--ease),color .18s}
.nav button:hover{color:var(--on-panel);background:rgba(244,243,238,.07)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--plate)}
.nav svg{width:19px;height:19px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--on-panel-2);white-space:nowrap}
.who b{color:var(--on-panel);font-weight:600}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:var(--r);border:1px solid var(--panel-line);background:none;color:var(--on-panel)}
.iconbtn:hover{background:rgba(244,243,238,.08)}
.iconbtn svg{width:19px;height:19px}

main{padding:20px;max-width:1500px;margin:0 auto}
.view-title{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 16px}
h1,h2,h3{font-family:var(--fc);font-weight:700;letter-spacing:.02em;margin:0;line-height:1.1}
h1{font-size:30px;text-transform:uppercase}
h2{font-size:22px;text-transform:uppercase}
h3{font-size:18px}
.muted{color:var(--on-panel-2)}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r);
  border:1px solid transparent;background:var(--plate);color:var(--ink);font-family:var(--fc);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase;
  transition:transform .12s var(--ease),background .18s,box-shadow .18s;box-shadow:var(--shadow)}
.btn:hover{background:#fff}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn svg{width:18px;height:18px}
.btn-ink{background:var(--ink);color:var(--plate)}
.btn-ink:hover{background:#000}
.btn-line{background:none;box-shadow:none;border-color:currentColor}
.btn-line:hover{background:rgba(127,127,127,.1)}
.btn-danger{background:none;box-shadow:none;color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:var(--danger-bg)}
.btn-sm{min-height:36px;padding:0 12px;font-size:15px}
.btn-block{width:100%}

/* ---------- placas (superficies de contenido) ---------- */
.plate{background:var(--plate);color:var(--ink);border-radius:var(--r);box-shadow:var(--shadow);position:relative}
.plate .muted,.sheet .muted{color:var(--ink-3)}
.pad{padding:18px}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rule{height:1px;background:var(--plate-line);border:0;margin:4px 0}

label.f{display:grid;gap:5px;font-size:14px;font-weight:600;color:var(--ink-2)}
.inp{width:100%;min-height:46px;padding:0 12px;border-radius:var(--r);border:1.5px solid var(--plate-line);background:#fff;color:var(--ink);font-size:17px}
.inp:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(21,23,26,.12)}
.inp::placeholder{color:#8A8D93}
.inp.big{font-family:var(--fc);font-size:24px;font-weight:700}
.seg{display:inline-flex;border:1.5px solid var(--plate-line);border-radius:var(--r);overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:10px 14px;font-weight:600;font-size:15px;color:var(--ink-2);min-height:44px}
.seg button+button{border-left:1.5px solid var(--plate-line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--plate)}
.seg-panel{border-color:var(--panel-line);background:none}
.seg-panel button{color:var(--on-panel-2)}
.seg-panel button+button{border-color:var(--panel-line)}
.seg-panel button[aria-pressed="true"]{background:var(--plate);color:var(--ink)}

/* ---------- agenda / tablero ---------- */
.agenda{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.agenda>section,.cantina>section{min-width:0}
.datebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.datebar .day{font-family:var(--fc);font-weight:800;font-size:34px;text-transform:uppercase;letter-spacing:.02em;line-height:1;min-width:0}
.datebar .day small{display:block;font-size:15px;font-weight:600;color:var(--on-panel-2);letter-spacing:.08em;margin-top:4px}
.datepick{position:relative}
.datepick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.board-wrap{--tc:64px;--cw:118px;--bh:52px;overflow-x:auto;border-radius:8px;background:var(--panel-lo);border:1.5px solid var(--brand);padding:6px 8px 10px 4px;
  box-shadow:inset 0 2px 10px rgba(0,0,0,.25)}
.board{display:grid;position:relative;min-width:min-content}
.bh{position:sticky;top:0;z-index:3;background:var(--panel-lo);padding:4px 5px 8px;font-family:var(--fc);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.05em;text-align:center}
.bh:not(:first-child)>span{display:block;border:1.5px solid var(--brand-hi);border-radius:4px;padding:3px 4px 2px;line-height:1.1}
.bh small{display:block;font-weight:600;font-size:12.5px;color:var(--on-panel-2);letter-spacing:.03em;margin-top:3px;text-transform:none}
.bt{position:sticky;left:0;z-index:2;background:var(--panel-lo);padding:8px 10px 0 0;font-family:var(--fc);font-weight:700;font-size:18px;color:var(--on-panel-2);text-align:right}
.slot:disabled{cursor:default}
.bt.media{font-size:12px;opacity:.55;padding-top:4px}
.bt.media.is-now{opacity:1}
.slot .xr{font-weight:700}
.slot.libre{padding:2px 10px}
.slot.res.larga{justify-content:flex-start;padding-top:9px}
.durs{display:flex;flex-wrap:wrap;gap:6px}
.durs button{min-height:44px;padding:0 14px;border-radius:var(--r);border:1.5px solid var(--plate-line);background:#fff;font-weight:700;font-size:15px;color:var(--ink-2)}
.durs button[aria-pressed="true"]{background:var(--ink);color:var(--plate);border-color:var(--ink)}
.board-wrap{--rowp:16px}
.bt.pas{font-size:14px;padding-top:6px;opacity:.7}
.cell.pas{padding-top:1px;padding-bottom:1px}
.cell.pas .slot{padding:2px 8px;margin-top:0;box-shadow:none}
.cell.pas .slot::before,.cell.pas .slot::after{display:none}
.cell.pas .slot .n{font-size:13px;margin:0;-webkit-line-clamp:1}
.cell.pas .slot .x{display:none}
.cell.pas .slot .stamp{bottom:auto;top:50%;right:6px;transform:translateY(-50%);font-size:9.5px;padding:0 4px}
.slot .stamp.debe{position:absolute;border:2px solid var(--danger);color:var(--danger);border-radius:3px;font-family:var(--fc);font-weight:800;letter-spacing:.1em;opacity:1}
.slot.drop{animation:cuelga .42s var(--ease)}
@keyframes cuelga{0%{transform:translateY(-14px) rotate(-3deg);opacity:0}60%{transform:translateY(2px) rotate(.8deg);opacity:1}100%{transform:none}}
.sello{display:inline-block;border:2px solid var(--ink);color:var(--ink);border-radius:3px;padding:1px 7px;font-family:var(--fc);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;transform:rotate(-2deg)}
.sello.off{border-color:var(--ink-3);color:var(--ink-3)}
.caja-line{display:none}
.cell{padding:2px 5px;min-height:0}
.slot{width:100%;height:100%;border-radius:4px;text-align:left;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;gap:1px;position:relative;
  border:1.5px solid var(--panel-line);background:none;color:var(--on-panel-2);transition:transform .15s var(--ease),background .18s,border-color .18s}
.slot .t{font-family:var(--fc);font-weight:700;font-size:15px;letter-spacing:.04em}
.slot .n{font-family:var(--fc);font-weight:700;font-size:19px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .x{font-size:12.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.libre .n{font-size:15px;font-weight:600;color:var(--on-panel-2);opacity:.8}
.slot.libre:hover{border-color:var(--on-panel);color:var(--on-panel);background:rgba(244,243,238,.06)}
.slot.libre:hover .n{opacity:1;color:var(--on-panel)}
.slot.pasado{opacity:.4}
/* reservada = placa colgada */
.slot.res{background:var(--plate);color:var(--ink);border-color:transparent;box-shadow:var(--shadow);margin-top:2px}
.slot.res::before,.slot.res::after{content:"";position:absolute;top:-5px;width:6px;height:6px;border-radius:50%;background:var(--panel-lo);box-shadow:0 0 0 2px var(--plate-line)}
.slot.res::before{left:14px}.slot.res::after{right:14px}
.slot.res .x{color:var(--ink-2)}
.slot.res:hover{transform:translateY(-2px)}
/* cobrada = sello */
.slot.cobrada .stamp{position:absolute;right:8px;bottom:7px;transform:rotate(-8deg);border:2px solid var(--ink-2);color:var(--ink-2);border-radius:3px;
  padding:0 5px;font-family:var(--fc);font-weight:800;font-size:12px;letter-spacing:.1em;opacity:.85}
.slot.cobrada .n,.slot.cobrada .t{color:var(--ink-2)}
/* bloqueada = franja diagonal */
.slot.bloq{border-color:transparent;color:var(--on-panel);
  background:repeating-linear-gradient(45deg,rgba(244,243,238,.18) 0 10px,transparent 10px 20px)}
.slot.bloq .n{font-size:15px}
.bt.is-now{color:var(--ink)}
.bt.is-now::before{content:"";position:absolute;inset:4px 4px 4px 0;background:var(--now);border-radius:4px;z-index:-1}
.bt{isolation:isolate}
.nowline{position:absolute;left:var(--tc);right:0;height:0;border-top:2px solid var(--now);z-index:1;pointer-events:none}
.cell{position:relative;z-index:2}
.slot.libre{background:var(--panel-lo)}
.nowline::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.nowtag{position:absolute;z-index:4;margin-top:-11px;right:0;background:var(--now);color:var(--ink);font-family:var(--fc);font-weight:800;font-size:13px;letter-spacing:.06em;padding:1px 6px;border-radius:3px}

.rail{display:grid;gap:14px;position:sticky;top:80px}
.proximo{padding:18px}
.lbl{font-family:var(--fc);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
.proximo .big{font-family:var(--fc);font-weight:800;font-size:60px;line-height:1;margin:8px 0 2px;text-transform:uppercase}
.proximo .pc{font-family:var(--fc);font-weight:700;font-size:24px}
.proximo .big em{font-style:normal;background:var(--now);padding:0 6px;border-radius:3px}
.leyenda{display:grid;gap:9px;font-size:14px;color:var(--on-panel-2);padding:4px 2px}
.leyenda div{display:flex;align-items:center;gap:10px}
.sw{width:34px;height:20px;border-radius:3px;flex:none}
.sw.l{border:1.5px solid var(--panel-line)}
.sw.r{background:var(--plate)}
.sw.j{background:var(--ink);border:1px solid var(--panel-line)}
.sw.b{background:repeating-linear-gradient(45deg,rgba(244,243,238,.3) 0 5px,transparent 5px 10px);border:1px solid var(--panel-line)}

/* ---------- hoja lateral ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,20,36,.55);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--plate);color:var(--ink);
  box-shadow:-10px 0 30px -10px rgba(0,0,0,.5);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .28s var(--ease)}
.sheet.on{transform:none}
.sheet:not(.on){visibility:hidden;transition:transform .28s var(--ease),visibility 0s .28s}
.sheet-h{padding:18px 20px 14px;border-bottom:1px solid var(--plate-line);display:flex;align-items:flex-start;gap:12px}
.sheet-h h2{font-size:26px}
.sheet-h .iconbtn{margin-left:auto;color:var(--ink);border-color:var(--plate-line)}
.sheet-b{padding:18px 20px 28px;overflow:auto;display:grid;gap:16px;align-content:start}
.sheet .iconbtn:hover{background:var(--plate-2)}

.lines{display:grid;gap:0}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--plate-line)}
.line:last-child{border-bottom:0}
.line .grow{flex:1;min-width:0}
.line .sub{font-size:13px;color:var(--ink-3)}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--plate-line);border-radius:var(--r);background:#fff}
.qty button{width:34px;height:34px;border:0;background:none;color:var(--ink);display:grid;place-items:center}
.qty svg{width:16px;height:16px}
.qty span{min-width:26px;text-align:center;font-weight:700}
.total{font-family:var(--fc);font-weight:800;font-size:30px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:13px;font-weight:600;background:var(--plate-2);color:var(--ink-2)}
.pill.ink{background:var(--ink);color:var(--plate)}
.note{padding:12px 14px;border-radius:var(--r);background:var(--plate-2);font-size:14px;color:var(--ink-2)}
.note.warn{background:repeating-linear-gradient(45deg,#F1EEDC 0 10px,#E9E5CC 10px 20px);color:var(--ink)}

/* ---------- cantina ---------- */
.cantina{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.prod{text-align:left;border:0;padding:14px 14px 12px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;transition:transform .15s var(--ease)}
.prod:hover{transform:translateY(-2px)}
.prod:disabled{opacity:.5;cursor:not-allowed;transform:none}
.prod .pn{font-family:var(--fc);font-weight:700;font-size:20px;line-height:1.1}
.prod .pp{font-family:var(--fc);font-weight:800;font-size:22px}
.prod .ps{font-size:13px;font-weight:600;color:var(--ink-3)}
.prod .ps.low{color:var(--danger)}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--panel-line);background:none;color:var(--on-panel-2);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--plate);color:var(--ink);border-color:var(--plate)}
.ticket{position:sticky;top:80px}

/* ---------- tablas ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-family:var(--fc);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:10px 10px;border-bottom:1.5px solid var(--plate-line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--plate-line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl-wrap{overflow-x:auto}
.tag-low{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px;
  background:repeating-linear-gradient(45deg,#F3D9D4 0 6px,#EFCFC9 6px 12px);color:var(--danger)}

/* ---------- caja / resumen ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
.marcador{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel-lo);border-radius:var(--r);padding:8px;gap:8px;border:1px solid var(--panel-line)}
.marcador .c{background:var(--plate);color:var(--ink);border-radius:4px;padding:12px 14px}
.marcador .k{font-family:var(--fc);font-weight:700;font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.marcador .v{font-family:var(--fc);font-weight:800;font-size:28px;line-height:1.1;margin-top:4px;white-space:nowrap}
.marcador .s{font-size:13px;color:var(--ink-3)}
.bars{display:grid;gap:10px}
.bar-r{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:15px}
.bar-r .track{height:14px;background:var(--plate-2);border-radius:2px;overflow:hidden}
.bar-r .fill{height:100%;background:var(--panel)}
.heat{display:grid;gap:3px;font-size:12px}
.heat .hc{height:30px;border-radius:3px;display:grid;place-items:center;font-weight:600;font-size:11.5px}
.heat .hl{font-family:var(--fc);font-weight:700;font-size:13px;color:var(--ink-3);display:grid;align-items:center}
.heat-key{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.heat-key i{display:inline-block;width:22px;height:12px;border-radius:2px}

/* ---------- PIN ---------- */
.lock{min-height:100dvh;display:grid;place-items:center;padding:24px}
.lock-box{width:min(420px,100%);display:grid;gap:20px;justify-items:center;text-align:center}
.logo-plate{display:inline-flex;align-items:center;background:var(--plate);border-radius:4px;padding:5px 10px;box-shadow:var(--shadow)}
.logo-plate img{height:40px;width:auto;display:block}
.brand-name{font-size:15px;letter-spacing:.06em;color:var(--on-panel-2)}
.logo-full{padding:14px 20px}
.logo-full img{height:150px}
.lock-name{font-size:24px;text-transform:uppercase;letter-spacing:.04em}
.gate{width:min(380px,100%);display:grid;gap:12px;text-align:left}
.gate p{margin:0;color:var(--on-panel-2)}
.gate .inp{background:var(--plate)}
.gate label.f{color:var(--on-panel-2)}
.gate .err{color:#FFB4A8;font-weight:600;font-size:14px}
.lock.en-gate #ops,.lock.en-gate #dots,.lock.en-gate #padnum,.lock.en-gate #lockHint,.lock.en-gate .muted.q{display:none}
.ops{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.op{border:1.5px solid var(--panel-line);background:none;color:var(--on-panel);border-radius:var(--r);padding:10px 16px;font-family:var(--fc);font-weight:700;font-size:18px;letter-spacing:.03em;min-height:48px}
.op small{display:block;font-family:var(--f);font-weight:500;font-size:12px;color:var(--on-panel-2);letter-spacing:0}
.op[aria-pressed="true"]{background:var(--plate);color:var(--ink);border-color:var(--plate)}
.op[aria-pressed="true"] small{color:var(--ink-3)}
.dots{display:flex;gap:14px;height:22px;align-items:center}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--on-panel-2)}
.dots i.on{background:var(--plate);border-color:var(--plate)}
.dots.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad-num{display:grid;grid-template-columns:repeat(3,76px);gap:10px}
.pad-num button{height:64px;border-radius:var(--r);border:0;background:var(--plate);color:var(--ink);font-family:var(--fc);font-weight:700;font-size:28px;box-shadow:var(--shadow)}
.pad-num button:active{transform:translateY(1px)}
.pad-num .alt{background:none;color:var(--on-panel-2);box-shadow:none;font-size:16px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--ink);color:var(--plate);padding:12px 18px;border-radius:var(--r);
  font-weight:600;box-shadow:0 8px 24px -6px rgba(0,0,0,.5);transition:opacity .2s,transform .25s var(--ease);max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.aviso-servicio{margin:0 0 12px;padding:10px 14px;border-radius:var(--r);background:#FFF4D6;color:#5A3B00;border:1px solid #E9C46A;font-size:15px;font-weight:600}
.aviso-servicio.grave{background:#FDE2DF;color:#7A1510;border-color:#E39A92}
body.ocupado [data-act]{pointer-events:none}
body.ocupado{cursor:progress}
.demo-flag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--plate-2);padding:3px 8px;border-radius:3px}
.empty{padding:26px 18px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-family:var(--fc);font-size:20px;margin-bottom:4px}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .board-wrap{max-height:calc(100dvh - 120px);overflow:auto}
  .agenda{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;grid-template-columns:1fr 1fr;order:-1}
  .leyenda{display:none}
  .cantina{grid-template-columns:1fr}
  .ticket{position:static}
}
@media (max-width:760px){
  body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
  .bar{padding:10px 14px;gap:10px}
  .brand-name{display:none}
  .logo-plate img{height:32px}
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:35;background:var(--panel-lo);border-top:1px solid var(--panel-line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .nav button{flex-direction:column;gap:2px;font-size:12.5px;padding:6px 4px;flex:1}
  .nav svg{width:22px;height:22px}
  .who span{display:none}
  main{padding:14px}
  .rail{grid-template-columns:1fr}
  .rail .caja-mini{display:none}
  .proximo{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;padding:14px}
  .proximo .lbl{grid-column:1/-1;font-size:19px}
  .proximo .big{margin:0}
  .proximo .row{grid-column:1/-1;margin-top:6px!important}
  .caja-line{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 0 0;border:0;border-top:1px solid var(--plate-line);background:none;color:var(--ink);font-size:15px;text-align:left}
  .caja-line svg{width:18px;height:18px;margin-left:auto}
  .board-wrap{--tc:40px;--cw:70px;--bh:34px;max-height:calc(100dvh - 150px);overflow:auto;padding:4px 4px 8px 2px}
  .bh{font-size:14px;padding:2px 2px 6px;letter-spacing:.02em}
  .bh small{display:none}
  .bt{font-size:14px;padding:8px 5px 0 0}
  .cell{padding:3px 2px}
  .slot{padding:4px 6px}
  .slot .n{font-size:15px;white-space:normal;line-height:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:normal;word-break:normal;hyphens:manual}
  .slot .x{font-size:11px}
  .slot .x .xs{display:none}
  .cell.pas .slot .stamp ~ *{display:none}
  .cell.pas .slot:has(.stamp) .n{display:none}
  .cell.pas .slot:has(.stamp){align-items:center}
  .cell.pas .slot .stamp{position:static;transform:none;margin:0 auto}
  .slot.res::before{left:8px}.slot.res::after{right:8px}
  .slot.cobrada .stamp{right:3px;bottom:auto;top:4px;font-size:9px;padding:0 3px;transform:rotate(-4deg)}
  .slot.cobrada .n{margin-top:10px}
  .nowtag{display:none}
  .datebar .day{font-size:26px;flex-basis:100%;order:-1}
  :root{--row:32px}
  .bh{font-size:16px}
  .bt{font-size:15px;padding-right:6px}
  .marcador{grid-template-columns:repeat(2,minmax(0,1fr))}
  .marcador .v{font-size:23px}
  .sheet{top:auto;height:92dvh;width:100%;border-radius:10px 10px 0 0;transform:translateY(102%)}
  .grid2{grid-template-columns:1fr}
  .pad-num{grid-template-columns:repeat(3,72px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* =========================================================
   1870 Pádel Club · Gestión — v1

const VERSION = 'v2';
const KEY = 'padel.club.v2';
const METODOS = [['efectivo','Efectivo'],['transferencia','Transferencia'],['tarjeta','Tarjeta']];
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DIAS_C = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
// corta palabras largas por sílaba (guion blando) para que no se partan a la mitad en placas angostas
const hy = s => esc(s).replace(/[A-Za-zÁÉÍÓÚÑáéíóúñÜü]{9,}/g, w => w.replace(/(?<=[aeiouáéíóúü])(?=[bcdfghjklmnñpqrstvwxyz][aeiouáéíóúü])/gi, '&shy;'));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const miles = n => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const gs = n => 'Gs. ' + miles(n);
const num = v => Number(String(v ?? '').replace(/\./g, '').replace(/[^\d-]/g, '')) || 0;
const pad2 = n => String(n).padStart(2, '0');
const FMT_PY = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Asuncion', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
function ahoraPY() { const p = {}; for (const x of FMT_PY.formatToParts(new Date())) p[x.type] = x.value; return { fecha: `${p.year}-${p.month}-${p.day}`, min: (+p.hour % 24) * 60 + +p.minute }; }
// hoy = fecha de Paraguay aunque el reloj del equipo tenga otra zona; con una fecha dada, la formatea tal cual
const hoyKey = d => d ? `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}` : ahoraPY().fecha;
const keyToDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = keyToDate(k); d.setDate(d.getDate() + n); return hoyKey(d); };
const toMin = h => { const [a, b] = h.split(':').map(Number); return a * 60 + b; };
const toHora = m => `${pad2(Math.floor(m / 60) % 24)}:${pad2(m % 60)}`;
const toIni = m => `${pad2(Math.floor(m / 60))}:${pad2(m % 60)}`; // clave del turno: 24:30 = 00:30 de esa misma noche
const hhmm = ts => { const d = new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const fechaCorta = ts => { const d = new Date(ts); return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)} ${hhmm(ts)}`; };
const diaLargo = k => { const d = keyToDate(k); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
function formatoMiles(el) { const p = el.selectionStart, len = el.value.length; el.value = el.value ? miles(num(el.value)) : ''; const np = p + (el.value.length - len); try { el.setSelectionRange(np, np); } catch (e) {} }

/* ---------- capa de datos ---------- */
function estadoVacio() {
  return {
    club: { nombre: '1870 Pádel Club', apertura: '08:00', cierre: '00:00', duracion: 60 },
    canchas: [], productos: [], reservas: {}, operadores: [],
    caja: { actual: null, cerradas: [] }, historial: [], demo: false, ver: 1
  };
}
const DB = (() => {
  let S = null;
  const bc = 'BroadcastChannel' in window ? new BroadcastChannel('padel-club') : null;
  function load() { try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; } if (!S) { S = sembrarDemo(estadoVacio()); save(); } if (S.club.nombre === 'Club de Pádel') S.club.nombre = '1870 Pádel Club'; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('No se pudo guardar en este dispositivo'); } }
  let enNube = false;
  if (bc) bc.onmessage = () => { if (!enNube) { load(); render(); } };
  window.addEventListener('storage', e => { if (!enNube && e.key === KEY) { load(); render(); } });
  return {
    get S() { return S; },
    get nube() { return enNube; },
    load,
    usarNube(estado) { enNube = true; S = estado; },
    commit(fn, accion, detalle) {
      if (enNube) { fn(S); if (accion) nube.log(accion, detalle); render(); return; }
      fn(S);
      if (accion) { S.historial.unshift({ ts: Date.now(), op: OP ? OP.nombre : '—', accion, detalle: detalle || '' }); if (S.historial.length > 3000) S.historial.length = 3000; }
      save(); if (bc) bc.postMessage(1); render();
    },
    reemplazar(nuevo) { S = nuevo; save(); if (bc) bc.postMessage(1); render(); }
  };
})();

/* ---------- datos de demostración ---------- */
function reservasDemo(S, fk, canchaId) { return Object.values(S.reservas).filter(r => r.fecha === fk && r.canchaId === canchaId); }
function sembrarDemo(S) {
  S.demo = true;
  S.operadores = [
    { id: 'op-admin', nombre: 'Administración', pin: '1234', rol: 'admin', activo: true },
    { id: 'op-rec', nombre: 'Recepción', pin: '0000', rol: 'operador', activo: true }
  ];
  S.canchas = [1, 2, 3, 4].map(i => ({ id: 'c' + i, nombre: 'Cancha ' + i, precio: i === 4 ? 180000 : 150000, techada: i === 4, bloqueo: '' }));
  S.productos = [
    ['Agua 500 ml', 'Bebidas', 5000, 2500, 48, 12],
    ['Gatorade', 'Bebidas', 12000, 7000, 20, 8],
    ['Coca-Cola 500 ml', 'Bebidas', 8000, 4500, 30, 10],
    ['Cerveza lata', 'Bebidas', 12000, 6500, 7, 12],
    ['Barrita de cereal', 'Snacks', 6000, 3000, 25, 6],
    ['Papas fritas', 'Snacks', 9000, 5000, 4, 6],
    ['Tubo de pelotas', 'Pádel', 45000, 30000, 9, 4],
    ['Overgrip', 'Pádel', 20000, 11000, 12, 4],
    ['Alquiler de paleta', 'Alquiler', 15000, 0, 6, 0, 'alquiler']
  ].map(([nombre, cat, precio, costo, stock, minimo, tipo]) => ({ id: uid(), nombre, cat, precio, costo, stock, minimo, tipo: tipo || 'venta' }));
  // historial de reservas de las últimas 8 semanas (para el mapa de horas), con duraciones de 1 h a 2 h
  const nombres = ['Martínez', 'Gómez', 'Benítez', 'Villalba', 'Duarte', 'Cáceres', 'Ortiz', 'Giménez', 'Rojas', 'Acosta', 'Franco', 'Sosa'];
  S.canchas.forEach(c => c.precio = c.techada ? 120000 : 100000);
  const lim = limites(S.club), hoy = hoyKey(), now = ahoraMin();
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const poner = (fk, c, ini, dur, datos) => { const id = uid(); S.reservas[id] = { id, fecha: fk, canchaId: c.id, ini: toHora(ini), dur, tel: '', jugadores: 4, consumos: [], pagos: [], creado: Date.now(), ...datos }; return S.reservas[id]; };
  for (let d = -56; d <= 1; d++) {
    const fk = addDays(hoy, d), dow = keyToDate(fk).getDay();
    for (const c of S.canchas) {
      let m = lim.a;
      while (m + 60 <= lim.c) {
        const h = m / 60;
        let p = h >= 18 ? .75 : h >= 16 ? .45 : h < 10 ? .2 : .12;
        if (dow === 0 || dow === 6) p = h >= 9 && h < 20 ? .55 : .3;
        if (d > 0) p *= .6;
        if (rnd() > p) { m += PASO; continue; }
        const dur = Math.min([60, 60, 90, 120][Math.floor(rnd() * 4)], lim.c - m);
        const pasado = d < 0 || (d === 0 && m + dur <= now);
        if (d === 0 && m < now && m + dur > now) { m += dur; continue; } // el turno de ahora se pone abajo
        const consumos = [];
        if (pasado) for (const pr of S.productos) {
          const prob = pr.cat === 'Bebidas' ? .35 : pr.tipo === 'alquiler' ? .15 : .08;
          if (rnd() < prob) consumos.push({ prodId: pr.id, nombre: pr.nombre, precio: pr.precio, costo: pr.costo, cant: 1 + Math.floor(rnd() * (pr.cat === 'Bebidas' ? 4 : 2)), tipo: pr.tipo });
        }
        const precio = precioPor(c, dur), tot = precio + consumos.reduce((a, k) => a + k.precio * k.cant, 0);
        poner(fk, c, m, dur, { cliente: nombres[Math.floor(rnd() * nombres.length)] + ' x4', precio, estado: pasado ? 'cobrada' : 'reservada', consumos,
          pagos: pasado ? [{ ts: keyToDate(fk).getTime() + (m + dur) * 60000, monto: tot, metodo: rnd() < .6 ? 'efectivo' : 'transferencia', op: 'Recepción' }] : [] });
        m += dur;
      }
    }
  }
  // hoy: un turno en curso, un horario bloqueado y un turno terminado sin cobrar, para ver todos los estados
  const libreEn = (c, ini, dur) => !reservasDemo(S, hoy, c.id).some(r => ini < toMin(r.ini) + r.dur && toMin(r.ini) < ini + dur);
  const enJuego = Math.floor(now / PASO) * PASO;
  if (enJuego >= lim.a && enJuego + 60 <= lim.c && libreEn(S.canchas[2], enJuego, 60)) poner(hoy, S.canchas[2], enJuego, 60, { cliente: 'Villalba x4', precio: precioPor(S.canchas[2], 60), estado: 'reservada' });
  for (let m = Math.max(lim.a, Math.ceil((now + 60) / 60) * 60); m + 60 <= lim.c; m += 60) if (libreEn(S.canchas[3], m, 60)) { poner(hoy, S.canchas[3], m, 60, { cliente: 'Mantenimiento', precio: 0, estado: 'bloqueo' }); break; }
  for (let m = Math.floor((now - 60) / 60) * 60; m >= lim.a; m -= 60) if (m + 60 <= now && libreEn(S.canchas[0], m, 60)) { poner(hoy, S.canchas[0], m, 60, { cliente: 'Rojas x4', precio: precioPor(S.canchas[0], 60), estado: 'reservada' }); break; }
  S.historial.unshift({ ts: Date.now(), op: 'Sistema', accion: 'Datos de demostración cargados', detalle: '' });
  return S;
}

/* ---------- lógica de agenda: alquiler por hora sobre una grilla de 30 minutos ---------- */
const PASO = 30;
function limites(club) { const a = toMin(club.apertura); let c = toMin(club.cierre); if (c <= a) c += 1440; return { a, c }; }
function slotsDe(club) { const { a, c } = limites(club); const out = []; for (let m = a; m + PASO <= c; m += PASO) out.push({ ini: m }); return out; }
const ahoraMin = () => ahoraPY().min;
const durDe = r => +r.dur || 60;
const finDe = r => toMin(r.ini) + durDe(r);
function reservasDia(fk, canchaId) { return Object.values(DB.S.reservas).filter(r => r.fecha === fk && r.estado !== 'cancelada' && (!canchaId || r.canchaId === canchaId)); }
function reservaEn(fk, canchaId, min) { return reservasDia(fk, canchaId).find(r => min >= toMin(r.ini) && min < finDe(r)); }
// hasta qué minuto está libre esa cancha desde "min" (próxima reserva o cierre)
function libreHasta(fk, canchaId, min, excepto) { let fin = limites(DB.S.club).c; for (const r of reservasDia(fk, canchaId)) { const i = toMin(r.ini); if (r.id !== excepto && i >= min && i < fin) fin = i; } return fin; }
const precioPor = (c, dur) => Math.round((+c.precio || 0) * dur / 60);
function fmtDur(m) { const h = Math.floor(m / 60), mm = m % 60; return (h ? h + ' h' : '') + (mm ? (h ? ' ' : '') + mm + ' min' : ''); }
const rango = r => `${toHora(toMin(r.ini))}–${toHora(finDe(r))}`;
function totalReserva(r) { return (+r.precio || 0) + (r.consumos || []).reduce((a, c) => a + c.precio * c.cant, 0); }
function pagado(r) { return (r.pagos || []).reduce((a, p) => a + p.monto, 0); }
function proximoLibre(fk) {
  const S = DB.S, esHoy = fk === hoyKey(), now = ahoraMin();
  for (const s of slotsDe(S.club)) {
    if (esHoy && s.ini + PASO <= now) continue;
    for (const c of S.canchas) if (!c.bloqueo && !reservaEn(fk, c.id, s.ini)) return { cancha: c, ini: toIni(s.ini), hasta: toHora(libreHasta(fk, c.id, s.ini)) };
  }
  return null;
}
// tramos libres de una cancha en el día: [[ini, fin], ...]
function tramosLibres(fk, c) {
  const esHoy = fk === hoyKey(), now = ahoraMin(), out = [];
  for (const s of slotsDe(DB.S.club)) {
    if (c.bloqueo || (esHoy && s.ini + PASO <= now) || reservaEn(fk, c.id, s.ini)) continue;
    const u = out[out.length - 1]; if (u && u[1] === s.ini) u[1] += PASO; else out.push([s.ini, s.ini + PASO]);
  }
  return out;
}

let METODO = 'efectivo';

/* ---------- acciones de reservas ---------- */
function reservar() {
  const h = HOJA, cliente = $('#rCliente').value.trim();
  if (!cliente) { toast('Escribí el nombre de quien reserva'); $('#rCliente').focus(); return; }
  const ini = toMin(h.h), dur = DUR_SEL;
  if (libreHasta(h.fecha, h.c, ini) < ini + dur || reservaEn(h.fecha, h.c, ini)) { toast('Ese horario se superpone con otra reserva'); renderHoja(); return; }
  const c = DB.S.canchas.find(x => x.id === h.c), id = uid();
  const precio = esAdmin() ? num($('#rPrecio').value) : precioPor(c, dur);
  NUEVA = id; setTimeout(() => { NUEVA = null; }, 700);
  DB.commit(S => { S.reservas[id] = { id, fecha: h.fecha, canchaId: h.c, ini: h.h, dur, cliente, tel: $('#rTel').value.trim(), jugadores: 4, precio, estado: 'reservada', consumos: [], pagos: [], creado: Date.now() }; },
    'Reserva creada', `${c.nombre} ${h.fecha} ${h.h} · ${fmtDur(dur)} · ${cliente}`);

}
async function bloquearSlot() {
  const f = await pedir('Bloquear horario', [{ id: 'm', label: 'Motivo', valor: 'Mantenimiento', ph: 'Mantenimiento, clase, torneo…' }], { boton: 'Bloquear' }); if (!f) return; const motivo = f.m;
  const h = HOJA, id = uid(), ini = toMin(h.h), dur = Math.min(60, libreHasta(h.fecha, h.c, ini) - ini);
  DB.commit(S => { S.reservas[id] = { id, fecha: h.fecha, canchaId: h.c, ini: h.h, dur, cliente: motivo || 'Bloqueado', estado: 'bloqueo', precio: 0, consumos: [], pagos: [] }; }, 'Horario bloqueado', `${h.fecha} ${h.h} · ${motivo}`);
}
function ajustarStock(S, prodId, delta, tipo, detalle) { const p = S.productos.find(x => x.id === prodId); if (p) p.stock = Math.max(0, p.stock + delta); }
function devolverAlquileres(S, r) { for (const k of r.consumos || []) if (k.tipo === 'alquiler') ajustarStock(S, k.prodId, k.cant); }

const ACT = {
  ir: d => { VISTA = d.v; if (d.v === 'agenda') IR_AHORA = true; cerrarHoja(); render(); window.scrollTo({ top: 0 }); },

  metodo: d => { METODO = d.m; renderHoja(); },
  durSel: d => { const nom = $('#rCliente')?.value, tel = $('#rTel')?.value; DUR_SEL = +d.m; renderHoja(); if (nom) $('#rCliente').value = nom; if (tel) $('#rTel').value = tel; },
  partes: d => { PARTES = +d.n; renderHoja(); },
  extender: d => {
    const r = DB.S.reservas[d.id], m = +d.m, c = DB.S.canchas.find(x => x.id === r.canchaId);
    if (libreHasta(r.fecha, r.canchaId, finDe(r), r.id) < finDe(r) + m) { toast('El horario siguiente está ocupado'); return; }
    DB.commit(S => { const x = S.reservas[d.id]; x.dur = durDe(x) + m; x.precio = (+x.precio || 0) + precioPor(c, m); }, 'Turno extendido', `+${m} min · ${resTxt(d.id)}`);
    toast(`Se sumaron ${fmtDur(m)}: ${gs(precioPor(c, m))}`);
  },
  addConsumo: d => {
    const p = DB.S.productos.find(x => x.id === d.p); if (!p || p.stock <= 0) { toast('Sin stock'); return; }
    DB.commit(S => {
      const r = S.reservas[d.id]; r.consumos = r.consumos || [];
      const k = r.consumos.find(x => x.prodId === p.id);
      if (k) k.cant++; else r.consumos.push({ prodId: p.id, nombre: p.nombre, precio: p.precio, costo: p.costo || 0, cant: 1, tipo: p.tipo });
      ajustarStock(S, p.id, -1);
    }, 'Consumo a cancha', `${p.nombre} → ${resTxt(d.id)}`);
  },
  consumo: d => {
    DB.commit(S => {
      const r = S.reservas[d.id], k = r.consumos[+d.i], p = S.productos.find(x => x.id === k.prodId);
      if (+d.d > 0 && (!p || p.stock <= 0)) { toast('Sin stock'); return; }
      k.cant += +d.d; ajustarStock(S, k.prodId, -(+d.d));
      if (k.cant <= 0) r.consumos.splice(+d.i, 1);
    }, +d.d > 0 ? 'Consumo a cancha' : 'Consumo quitado', resTxt(d.id));
  },
  cobrar: d => {
    const monto = +d.monto;
    if (d.cerrar) { DB.commit(S => { const r = S.reservas[d.id]; r.estado = 'cobrada'; r.cobradaTs = Date.now(); devolverAlquileres(S, r); }, 'Cuenta cerrada', resTxt(d.id)); return; }
    if (!(monto > 0)) return;
    if (!DB.S.caja.actual) { toast('Abrí la caja primero'); return; }
    DB.commit(S => {
      const r = S.reservas[d.id];
      r.pagos.push({ ts: Date.now(), monto, metodo: METODO, op: OP.nombre, parte: !!d.parte });
      S.caja.actual.movs.push({ ts: Date.now(), tipo: 'cancha', monto, metodo: METODO, ref: `${nombreCancha(r.canchaId)} ${r.ini} · ${r.cliente}`, op: OP.nombre,
        detalle: { turno: 0, consumos: [] } });
      if (pagado(r) >= totalReserva(r)) { r.estado = 'cobrada'; r.cobradaTs = Date.now(); devolverAlquileres(S, r); }
    }, 'Cobro de cancha', `${resTxt(d.id)} · ${gs(monto)} · ${METODO}`);
    toast('Cobrado ' + gs(monto));
  },
  editarRes: async d => {
    const r = DB.S.reservas[d.id];
    const f = await pedir('Editar reserva', [{ id: 'c', label: 'Nombre de quien reserva', valor: r.cliente }, { id: 'j', label: 'Jugadores', tipo: 'num', valor: r.jugadores }]); if (!f) return;
    const cliente = f.c, jug = f.j;
    DB.commit(S => { const x = S.reservas[d.id]; x.cliente = cliente.trim() || x.cliente; x.jugadores = Math.max(1, +jug || x.jugadores); }, 'Reserva editada', resTxt(d.id));
  },
  cancelarRes: async d => {

    const f = await pedir('Cancelar reserva', [{ id: 'm', label: '¿Por qué se cancela? (queda en el historial)', valor: 'Avisó que no viene' }], { boton: 'Cancelar reserva', peligro: true }); if (!f) return; const motivo = f.m;
    DB.commit(S => { const x = S.reservas[d.id]; x.estado = 'cancelada'; x.motivo = motivo; for (const k of x.consumos || []) ajustarStock(S, k.prodId, k.cant); }, 'Reserva cancelada', `${resTxt(d.id)} · ${motivo}`);
    cerrarHoja(); toast('Reserva cancelada');
  }
};

function mapaHoras() {
  const S = DB.S, lim = limites(S.club), desde = addDays(hoyKey(), -55), orden = [1, 2, 3, 4, 5, 6, 0];
  const horas = []; for (let m = Math.floor(lim.a / 60) * 60; m < lim.c; m += 60) horas.push(m);
  const cuenta = {};
  for (const r of Object.values(S.reservas)) {
    if (r.fecha < desde || r.fecha > hoyKey() || r.estado === 'cancelada' || r.estado === 'bloqueo') continue;
    const d = keyToDate(r.fecha).getDay(), i = toMin(r.ini), f = finDe(r);
    for (const h of horas) { const o = Math.max(0, Math.min(f, h + 60) - Math.max(i, h)); if (o) cuenta[d + '|' + h] = (cuenta[d + '|' + h] || 0) + o / 60; }
  }
  const tope = 8 * Math.max(1, S.canchas.length);
  const color = v => { const t = Math.min(1, v / tope); if (t <= 0) return 'background:var(--plate-2)'; const l = 92 - t * 72; return `background:hsl(229 70% ${l}%);color:${l < 55 ? 'var(--plate)' : 'var(--ink)'}`; };
  let h = `<div class="tbl-wrap"><div class="heat" style="grid-template-columns:44px repeat(${horas.length},minmax(40px,1fr));min-width:${44 + horas.length * 44}px"><span></span>${horas.map(m => `<span class="hl" style="justify-content:center">${toHora(m)}</span>`).join('')}`;
  for (const d of orden) { h += `<span class="hl">${DIAS_C[d]}</span>`; for (const m of horas) { const v = cuenta[d + '|' + m] || 0; h += `<span class="hc" style="${color(v)}" title="${DIAS[d]} ${toHora(m)}: ${Math.round(v)} h ocupadas">${v ? Math.round(Math.min(1, v / tope) * 100) + '%' : ''}</span>`; } }
  return h + `</div></div><div class="heat-key"><i style="background:var(--plate-2)"></i>vacío<i style="background:hsl(229 70% 74%)"></i>medio<i style="background:hsl(229 70% 22%)"></i>lleno · Usá las horas claras para promos.</div>`;
}

const NUBE_CFG = { url: 'https://oishkxlodwxfaskodafo.supabase.co', key: 'sb_publishable_apIt6AE-7gax1X6QWjdVZQ_QtAIoOhM', club: (new URLSearchParams(location.search).get('club') || '1870-padel').replace(/[^a-z0-9-]/g, '') };
const MODO_DEMO = new URLSearchParams(location.search).has('demo');

const ERRORES = {
  CAJA_CERRADA: 'Abrí la caja para poder cobrar', SIN_STOCK: 'No hay stock suficiente', RESERVA_CERRADA: 'Esa reserva ya está cerrada',
  MONTO_INVALIDO: 'El monto no es válido', TIENE_PAGOS: 'Tiene pagos registrados: no se puede cancelar', ALQUILER_SOLO_CANCHA: 'El alquiler se carga a la cuenta de una cancha',
  PEDIDO_VACIO: 'El pedido está vacío', HORARIO_OCUPADO: 'El horario siguiente ya está ocupado', FUERA_DE_HORARIO: 'Se pasa del horario de cierre del club', DEMASIADOS_INTENTOS: 'Demasiados intentos. Esperá una hora e intentá de nuevo.', PRODUCTO_NO_EXISTE: 'Ese producto ya no existe', CANCHA_CON_RESERVAS: 'Esa cancha tiene reservas pendientes. Cancelalas o movelas antes de borrarla.', CANTIDAD_INVALIDA: 'La cantidad tiene que ser 1 o más', METODO_INVALIDO: 'Elegí la forma de pago', CANCHA_NO_EXISTE: 'Esa cancha ya no existe', YA_PAGADO: 'No se puede quitar: esa parte ya está cobrada', PIN_ADMIN: 'PIN de administrador incorrecto', SIN_ADMIN: 'Tiene que quedar al menos un administrador activo', YA_HAY_ADMIN: 'El club ya tiene administrador', NO_AUTORIZADO: 'Este dispositivo no tiene permiso', FALTA_NOMBRE: 'Poné el nombre'
};
function msgError(e) {
  const m = String((e && (e.message || e.details)) || e || '');
  if (e && e.code === '23P01') return 'Ese horario se superpone con otra reserva';
  if (e && e.code === '23505') return m.includes('cajas_una_abierta') ? 'Ya hay una caja abierta' : m.includes('reservas_turno') ? 'Ese horario se acaba de ocupar' : m.includes('pin') ? 'Ese PIN ya lo usa otra persona' : 'Ese dato ya existe';
  const k = Object.keys(ERRORES).find(k => m.includes(k));
  if (k) return ERRORES[k];
  return navigator.onLine ? 'No se pudo guardar. ' + m.slice(0, 90) : 'Sin conexión: revisá internet e intentá de nuevo';
}
async function q(p) { const { data, error } = await p; if (error) throw error; return data; }
// Supabase entrega de a 1000 filas: pide página por página hasta traer todo
async function todo(armar, n = 1000) { let out = [], i = 0; for (;;) { const r = await q(armar().range(i, i + n - 1)); out = out.concat(r); if (r.length < n) return out; i += n; } }
const ms = v => v ? Date.parse(v) : null;

const nube = {
  estado: 'cargando', err: '', desde: null, hasta: null, pendiente: false,
  get C() { return NUBE_CFG.club; },
  get S() { return DB.S; },

  async iniciar() {
    this.estado = 'cargando'; render();
    try {
      if (!window.supabase) throw new Error(navigator.onLine ? 'No cargó la librería de datos' : 'Sin conexión');
      sb = sb || supabase.createClient(NUBE_CFG.url, NUBE_CFG.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'orbe-clientes-auth' } });
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { const r = await sb.auth.signInAnonymously(); if (r.error) throw r.error; }
      this.estado = await q(sb.rpc('mi_acceso', { p_club: this.C }));
      if (this.estado === 'ok') { await this.cargarTodo(); this.escuchar(); restaurarSesion(); this.revisarServicio(); }
    } catch (e) { this.estado = 'error'; this.err = msgError(e); }
    render();
  },

  // el proveedor (Orbe) puede suspender o vencer el servicio: se revisa al volver a la pantalla y cada 20 min
  servicio: null,
  async revisarServicio() {
    try {
      const est = await q(sb.rpc('mi_acceso', { p_club: this.C }));
      if (est !== 'ok') { this.estado = est; render(); return; }
      const antes = JSON.stringify(this.servicio);
      this.servicio = await q(sb.rpc('mi_servicio', { p_club: this.C }));
      if (JSON.stringify(this.servicio) !== antes) renderSeguro();
    } catch (e) {}
    if (!this.timerServ) this.timerServ = setInterval(() => this.revisarServicio(), 20 * 60 * 1000);
  },

  async cargarTodo() {
    this.desde = addDays(hoyKey(), -62); this.hasta = addDays(hoyKey(), 120);
    await Promise.all([this.cargarClub(), this.cargarCanchas(), this.cargarProductos(), this.cargarOperadores(),
      this.cargarReservas(), this.cargarCaja(), this.cargarHistorial(), this.cargarDispositivos()]);
  },
  async cargarClub() {
    const c = await q(sb.from('clubs').select('id,nombre,apertura,cierre,duracion,activo').eq('id', this.C).single());
    this.S.club = { nombre: c.nombre, apertura: c.apertura, cierre: c.cierre, duracion: c.duracion };
    try { localStorage.setItem('padel.nube.club', JSON.stringify(this.S.club)); } catch (e) {}
  },
  async cargarCanchas() {
    const r = await q(sb.from('canchas').select('*').eq('club_id', this.C).eq('archivada', false).order('orden').order('nombre'));
    this.S.canchas = r.map(c => ({ id: c.id, nombre: c.nombre, precio: c.precio, techada: c.techada, bloqueo: c.bloqueo || '' }));
  },
  async cargarProductos() {
    const r = await q(sb.from('productos').select('*').eq('club_id', this.C).eq('activo', true).order('cat').order('nombre'));
    this.S.productos = r.map(p => ({ id: p.id, nombre: p.nombre, cat: p.cat, precio: p.precio, costo: p.costo, stock: p.stock, minimo: p.minimo, tipo: p.tipo }));
  },
  async cargarOperadores() {
    const r = await q(sb.from('operadores').select('id,nombre,rol,activo').eq('club_id', this.C).order('nombre'));
    this.S.operadores = r;
  },
  mapReserva(r) {
    return { id: r.id, fecha: r.fecha, canchaId: r.cancha_id, ini: r.ini, dur: r.dur || 60, cliente: r.cliente, tel: r.tel, jugadores: r.jugadores, precio: r.precio,
      estado: r.estado, motivo: r.motivo, creado: ms(r.creado),
      consumos: (r.consumos || []).slice().sort((a, b) => a.nombre.localeCompare(b.nombre) || String(a.id).localeCompare(String(b.id))).map(c => ({ prodId: c.producto_id, nombre: c.nombre, precio: c.precio, costo: c.costo, cant: c.cant, tipo: c.tipo })),
      pagos: (r.pagos || []).sort((a, b) => ms(a.ts) - ms(b.ts)).map(p => ({ ts: ms(p.ts), monto: p.monto, metodo: p.metodo, op: p.operador, parte: p.parte })) };
  },
  async cargarReservas(desde = this.desde, hasta = this.hasta, reemplazar = true) {
    const r = await todo(() => sb.from('reservas').select('*, consumos(*), pagos:caja_movs(ts,monto,metodo,operador,parte)')
      .eq('club_id', this.C).gte('fecha', desde).lte('fecha', hasta).neq('estado', 'cancelada').order('fecha').order('ini').order('id'));
    const nuevo = reemplazar ? {} : { ...this.S.reservas };
    if (!reemplazar) for (const [k, v] of Object.entries(nuevo)) if (v.fecha >= desde && v.fecha <= hasta) delete nuevo[k];
    if (reemplazar) for (const [k, v] of Object.entries(this.S.reservas)) if (v.fecha < this.desde || v.fecha > this.hasta) nuevo[k] = v;
    for (const x of r) nuevo[x.id] = this.mapReserva(x);
    this.S.reservas = nuevo;
  },
  async asegurarFecha(fk) {
    if (fk >= this.desde && fk <= this.hasta) return;
    await this.cargarReservas(addDays(fk, -7), addDays(fk, 7), false); render();
  },
  async cargarCaja() {
    const cajas = await q(sb.from('cajas').select('*').eq('club_id', this.C).or(`cierre.is.null,apertura.gte.${this.desde}`).order('apertura', { ascending: false }).limit(120));
    const ids = cajas.map(c => c.id);
    const movs = ids.length ? await todo(() => sb.from('caja_movs').select('*').in('caja_id', ids).order('ts').order('id')) : [];
    const porCaja = {};
    for (const m of movs) (porCaja[m.caja_id] = porCaja[m.caja_id] || []).push({ ts: ms(m.ts), tipo: m.tipo, monto: m.monto, metodo: m.metodo, ref: m.ref, op: m.operador, items: m.items || undefined });
    const map = c => ({ id: c.id, apertura: ms(c.apertura), op: c.operador, inicial: c.inicial, movs: porCaja[c.id] || [],
      cierre: ms(c.cierre), opCierre: c.operador_cierre, contado: c.contado, esperado: c.esperado, cobrado: c.cobrado });
    const abierta = cajas.find(c => !c.cierre);

  },
  async cargarHistorial() {

    this.S.historial = r.map(h => ({ ts: ms(h.ts), op: h.operador, accion: h.accion, detalle: h.detalle }));
  },
  async cargarDispositivos() {
    const r = await q(sb.from('dispositivos').select('*').eq('club_id', this.C).order('creado'));
    this.S.dispositivos = r;
  },

  escuchar() {
    if (this.canal) return;
    const t = {};
    const prog = (k, f) => { clearTimeout(t[k]); t[k] = setTimeout(async () => { try { await f(); renderSeguro(); } catch (e) {} }, 300); };
    const ch = sb.channel('club-' + this.C);
    const on = (tabla, f) => ch.on('postgres_changes', { event: '*', schema: 'public', table: tabla, filter: 'club_id=eq.' + this.C }, () => prog(tabla, f));
    on('reservas', () => this.cargarReservas());
    on('consumos', () => this.cargarReservas());
    on('caja_movs', () => Promise.all([this.cargarCaja(), this.cargarReservas()]));
    on('cajas', () => this.cargarCaja());
    on('productos', () => this.cargarProductos());
    on('canchas', () => this.cargarCanchas());
    on('historial', () => Promise.all([this.cargarHistorial(), this.cargarCanchas()]));
    ch.on('postgres_changes', { event: '*', schema: 'public', table: 'clubs', filter: 'id=eq.' + this.C }, () => prog('clubs', () => { this.revisarServicio(); return this.cargarClub(); }));
    ch.subscribe();
    this.canal = ch;
    const refrescar = () => { if (this.estado === 'ok') { this.revisarServicio(); this.cargarTodo().then(renderSeguro).catch(() => {}); } };
    window.addEventListener('online', refrescar);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refrescar(); });
  },

  log(accion, detalle) { if (sb && this.estado === 'ok') sb.from('historial').insert({ club_id: this.C, operador: OP ? OP.nombre : '—', accion, detalle: detalle || '' }).then(() => {}); },

  // ejecuta una operación, muestra el error en palabras simples y refresca lo que cambió
  ocupado: false,
  async hacer(fn, recargar, ok) {
    if (this.ocupado) return;
    this.ocupado = true; document.body.classList.add('ocupado');
    try {
      try { await fn(); if (ok) toast(ok); } catch (e) { toast(msgError(e)); }
      try { await Promise.all((recargar || []).map(k => this['cargar' + k]())); } catch (e) {}
    } finally { this.ocupado = false; document.body.classList.remove('ocupado'); }
    render();
  }
};

// no re-dibujar mientras alguien está escribiendo; se dibuja al salir del campo

    const f = await pedir('Bloquear horario', [{ id: 'm', label: 'Motivo', valor: 'Mantenimiento', ph: 'Mantenimiento, clase, torneo…' }], { boton: 'Bloquear' }); if (!f) return; const motivo = f.m;
    const h = HOJA;
    const ini = toMin(h.h), dur = Math.min(60, libreHasta(h.fecha, h.c, ini) - ini);
    nube.hacer(async () => { await q(sb.from('reservas').insert({ club_id: nube.C, cancha_id: h.c, fecha: h.fecha, ini: h.h, dur, cliente: motivo || 'Bloqueado', estado: 'bloqueo', precio: 0, operador: OPN() })); nube.log('Horario bloqueado', `${h.fecha} ${h.h} · ${motivo}`); }, ['Reservas']);
  },
  desbloquearSlot: d => nube.hacer(async () => { await q(sb.from('reservas').update({ estado: 'cancelada', motivo: 'Desbloqueado' }).eq('id', d.id).eq('estado', 'bloqueo')); nube.log('Horario desbloqueado', `${HOJA.fecha} ${HOJA.h}`); }, ['Reservas']),
  extender: d => {
    const r = DB.S.reservas[d.id], m = +d.m, c = DB.S.canchas.find(x => x.id === r.canchaId);
    nube.hacer(() => q(sb.rpc('reserva_extender', { p_club: nube.C, p_reserva: d.id, p_min: m, p_op: OPN() })), ['Reservas'], `Se sumaron ${fmtDur(m)}: ${gs(precioPor(c, m))}`);
  },
  addConsumo: d => nube.hacer(() => q(sb.rpc('consumo_cambiar', { p_club: nube.C, p_reserva: d.id, p_producto: d.p, p_delta: 1, p_op: OPN() })), ['Reservas', 'Productos']),
  consumo: d => {
    nube.hacer(() => q(sb.rpc('consumo_cambiar', { p_club: nube.C, p_reserva: d.id, p_producto: d.p, p_delta: +d.d, p_op: OPN() })), ['Reservas', 'Productos']);
  },
  cobrar: d => {
    const monto = +d.monto; if (!(monto > 0) && !d.cerrar) return;
    nube.hacer(() => q(sb.rpc('reserva_cobrar', { p_club: nube.C, p_reserva: d.id, p_monto: monto, p_metodo: METODO, p_op: OPN(), p_parte: !!d.parte })),
      ['Reservas', 'Caja', 'Productos'], 'Cobrado ' + gs(monto));
  },
  editarRes: async d => {
    const r = DB.S.reservas[d.id];
    const f = await pedir('Editar reserva', [{ id: 'c', label: 'Nombre de quien reserva', valor: r.cliente }, { id: 'j', label: 'Jugadores', tipo: 'num', valor: r.jugadores }]); if (!f) return;
    const cliente = f.c, jug = f.j;
    nube.hacer(async () => { await q(sb.from('reservas').update({ cliente: cliente.trim() || r.cliente, jugadores: Math.max(1, +jug || r.jugadores) }).eq('id', d.id)); nube.log('Reserva editada', resTxt(d.id)); }, ['Reservas']);
  },
  cancelarRes: async d => {
    const r = DB.S.reservas[d.id];
    if (pagado(r) > 0) { toast('Tiene pagos registrados: no se puede cancelar. Si ya está todo pago, cerrá la cuenta.'); return; }
    const f = await pedir('Cancelar reserva', [{ id: 'm', label: '¿Por qué se cancela? (queda en el historial)', valor: 'Avisó que no viene' }], { boton: 'Cancelar reserva', peligro: true }); if (!f) return; const motivo = f.m;
    cerrarHoja();
    nube.hacer(() => q(sb.rpc('reserva_cancelar', { p_club: nube.C, p_reserva: d.id, p_motivo: motivo, p_op: OPN() })), ['Reservas', 'Productos'], 'Reserva cancelada');
  },
  venderYa: () => {
    if (!CARRO.length) return;
    const items = CARRO.map(k => ({ id: k.prodId, cant: k.cant }));
    nube.hacer(async () => { const tot = await q(sb.rpc('venta_cantina', { p_club: nube.C, p_items: items, p_metodo: METODO, p_op: OPN() })); CARRO = []; toast('Venta cobrada ' + gs(tot)); }, ['Productos', 'Caja']);
  },
  cargarCancha: () => {
    const r = DB.S.reservas[DESTINO]; if (!r || !CARRO.length) return;
    const items = CARRO.map(k => ({ id: k.prodId, cant: k.cant }));
    nube.hacer(async () => { await q(sb.rpc('pedido_a_cancha', { p_club: nube.C, p_reserva: r.id, p_items: items, p_op: OPN() })); CARRO = []; }, ['Reservas', 'Productos'], 'Cargado a ' + nombreCancha(r.canchaId));
  },
  entrada: async d => {
    const p = DB.S.productos.find(x => x.id === d.p);
    const f = await pedir('Entrada · ' + p.nombre, [{ id: 'n', label: '¿Cuántas unidades entraron?', tipo: 'num', valor: '' }, ...(esAdmin() && p.tipo !== 'alquiler' ? [{ id: 'c', label: 'Costo por unidad de esta compra', tipo: 'gs', valor: p.costo }] : [])], { boton: 'Sumar al stock' }); if (!f) return;
    const cant = Math.max(0, Math.round(f.n || 0)); if (!cant) { toast('Poné cuántas unidades entraron'); return; }
    let costo = null;
    if (esAdmin() && p.tipo !== 'alquiler') { costo = f.c || p.costo; }
    nube.hacer(() => q(sb.rpc('entrada_mercaderia', { p_club: nube.C, p_producto: p.id, p_cant: cant, p_costo: costo, p_op: OPN() })), ['Productos'], `Stock de ${p.nombre}: +${cant}`);
  },
  guardarProd: d => {
    const nombre = $('#pNom').value.trim(); if (!nombre) { toast('Poné el nombre'); return; }
    const datos = { nombre, cat: $('#pCat').value.trim() || 'Otros', tipo: $('#pTipo').value, precio: num($('#pPre').value), costo: num($('#pCos').value), stock: Math.max(0, +$('#pSto').value || 0), minimo: Math.max(0, +$('#pMin').value || 0) };
    cerrarHoja();
    nube.hacer(async () => {
      if (d.id) await q(sb.from('productos').update(datos).eq('id', d.id)); else await q(sb.from('productos').insert({ club_id: nube.C, ...datos }));
      nube.log(d.id ? 'Producto editado' : 'Producto nuevo', `${nombre} · ${gs(datos.precio)}`);
    }, ['Productos'], 'Guardado');
  },
  borrarProd: async d => {
    const p = DB.S.productos.find(x => x.id === d.id); if (!(await confirmar(`¿Quitar “${p.nombre}” de la cantina?`, 'Quitar'))) return;
    cerrarHoja();
    nube.hacer(async () => { await q(sb.from('productos').update({ activo: false }).eq('id', d.id)); nube.log('Producto quitado', p.nombre); }, ['Productos']);
  },
  abrirCaja: () => {
    const ini = num($('#cIni').value);
    nube.hacer(async () => { await q(sb.from('cajas').insert({ club_id: nube.C, operador: OPN(), inicial: ini })); nube.log('Caja abierta', gs(ini)); }, ['Caja'], 'Caja abierta');
  },
  cerrarCaja: async () => {
    const c = DB.S.caja.actual; if (!$('#cCont').value) { toast('Escribí el efectivo contado'); $('#cCont').focus(); return; }
    const contado = num($('#cCont').value), ef = c.movs.filter(m => m.metodo === 'efectivo').reduce((a, m) => a + m.monto, 0), esperado = c.inicial + ef;
    if (!(await confirmar(`Esperado ${gs(esperado)} · Contado ${gs(contado)} · Diferencia ${gs(contado - esperado)}`, 'Cerrar caja', false))) return;
    nube.hacer(() => q(sb.rpc('caja_cerrar', { p_club: nube.C, p_contado: contado, p_op: OPN() })), ['Caja'], 'Caja cerrada');
  },
  guardarClub: () => {
    const n = $('#aNom').value.trim() || DB.S.club.nombre, ab = $('#aAbre').value, ci = $('#aCierra').value, du = +$('#aDur').value;
    if (!ab || !ci) { toast('Completá los horarios'); return; }
    if (toMin(ab) % 30 || toMin(ci) % 30) { toast('Usá horas en punto o y media (ej.: 08:00, 23:30)'); return; }
    if (ab === ci) { toast('La hora de cierre tiene que ser distinta a la de apertura'); return; }
    nube.hacer(async () => { await q(sb.from('clubs').update({ nombre: n, apertura: ab, cierre: ci, duracion: du }).eq('id', nube.C)); nube.log('Ajustes del club', `${n} · ${ab}–${ci} · ${du} min`); }, ['Club'], 'Guardado');
  },
  nuevaCancha: async () => {
    const f = await formCancha(null); if (!f || !f.n) return; const n = f.n, p = f.p;
    nube.hacer(async () => { await q(sb.from('canchas').insert({ club_id: nube.C, nombre: n, precio: p, techada: f.t, orden: DB.S.canchas.length + 1 })); nube.log('Cancha agregada', `${n} · ${gs(p)}`); }, ['Canchas'], 'Cancha agregada');
  },
  editCancha: async d => {
    const c = DB.S.canchas.find(x => x.id === d.id);
    const f = await formCancha(c); if (!f) return; const n = f.n, p = String(f.p), t = f.t;
    nube.hacer(async () => { await q(sb.from('canchas').update({ nombre: n.trim() || c.nombre, precio: num(p) || c.precio, techada: t }).eq('id', d.id)); nube.log('Cancha editada', `${n} · ${gs(num(p))}`); }, ['Canchas']);
  },
  bloqCancha: async d => {
    const c = DB.S.canchas.find(x => x.id === d.id);
    let m = '';
    if (!c.bloqueo) { const f = await pedir('Bloquear ' + c.nombre, [{ id: 'm', label: 'Motivo', valor: 'Mantenimiento', ph: 'Lluvia, mantenimiento…' }], { boton: 'Bloquear' }); if (!f || !f.m) return; m = f.m; }
    nube.hacer(async () => { await q(sb.from('canchas').update({ bloqueo: m }).eq('id', d.id)); nube.log(m ? 'Cancha bloqueada' : 'Cancha habilitada', c.nombre + (m ? ' · ' + m : '')); }, ['Canchas']);
  },
  borrarCancha: async d => {
    const c = DB.S.canchas.find(x => x.id === d.id);
    if (!await confirmar(`¿Borrar ${c.nombre}? Deja de aparecer en la agenda. Los cobros ya hechos quedan en la caja y el resumen.`, 'Borrar cancha')) return;
    nube.hacer(() => q(sb.rpc('cancha_borrar', { p_club: nube.C, p_cancha: c.id, p_op: OP.nombre })), ['Canchas', 'Historial'], 'Cancha borrada');
  },
  nuevoOp: () => editarOpNube(null), editOp: d => editarOpNube(d.id),
  guardarOp: async d => {
    const nombre = $('#oNom').value.trim(), pin = $('#oPin').value.trim(), rol = $('#oRol').value, activo = $('#oAct').checked;
    if (!nombre) { toast('Poné el nombre'); return; }
    if (!d.id && !/^\d{4}$/.test(pin)) { toast('El PIN tiene que ser de 4 números'); return; }
    if (pin && !/^\d{4}$/.test(pin)) { toast('El PIN tiene que ser de 4 números'); return; }
    const admins = DB.S.operadores.filter(o => o.rol === 'admin' && o.activo && o.id !== d.id).length;
    if (!admins && (rol !== 'admin' || !activo)) { toast('Tiene que quedar al menos un administrador activo'); return; }
    try { if (pin && !(await q(sb.rpc('pin_libre', { p_club: nube.C, p_pin: pin, p_excepto: d.id || null })))) { toast('Ese PIN ya lo usa otra persona'); return; } } catch (e) { toast(msgError(e)); return; }
    let adminPin = OP_PIN;
    if (!adminPin) { const f = await pedir('Confirmá con tu PIN', [{ id: 'p', label: 'Tu PIN de administrador' }], { boton: 'Confirmar' }); if (!f || !/^\d{4}$/.test(f.p || '')) return; adminPin = f.p; }
    cerrarHoja();
    nube.hacer(async () => {
      await q(sb.rpc('operador_guardar', { p_club: nube.C, p_admin: OP.id, p_admin_pin: adminPin, p_id: d.id || null, p_nombre: nombre, p_pin: pin || null, p_rol: rol, p_activo: activo }));
      OP_PIN = adminPin;
      nube.log(d.id ? 'Persona editada' : 'Persona agregada', `${nombre} · ${rol}`);
    }, ['Operadores'], 'Guardado');
  },
  dispActivo: d => nube.hacer(async () => { await q(sb.from('dispositivos').update({ activo: d.v === '1' }).eq('club_id', nube.C).eq('user_id', d.id)); nube.log(d.v === '1' ? 'Dispositivo reactivado' : 'Dispositivo desactivado', d.n); }, ['Dispositivos']),
  borrarDemo: () => {}
};
function editarOpNube(id) {
  const o = id ? DB.S.operadores.find(x => x.id === id) : { nombre: '', rol: 'operador', activo: true };
  $('#sheet').innerHTML = `<div class="sheet-h"><h2>${id ? 'Editar persona' : 'Nueva persona'}</h2><button class="iconbtn" data-act="cerrarHoja" aria-label="Cerrar"><svg><use href="#i-x"/></svg></button></div>
  <div class="sheet-b">
    <label class="f">Nombre<input class="inp" id="oNom" value="${esc(o.nombre)}"></label>
    <label class="f">${id ? 'PIN nuevo (dejalo vacío para no cambiarlo)' : 'PIN de 4 números'}<input class="inp big" id="oPin" inputmode="numeric" maxlength="4" autocomplete="off"></label>
    <label class="f">Rol<select class="inp" id="oRol"><option value="operador" ${o.rol !== 'admin' ? 'selected' : ''}>Operador (reservas, cantina y caja)</option><option value="admin" ${o.rol === 'admin' ? 'selected' : ''}>Administrador (todo, precios y reportes)</option></select></label>
    <label class="row" style="font-weight:600"><input type="checkbox" id="oAct" ${o.activo ? 'checked' : ''} style="width:20px;height:20px"> Puede entrar</label>
    <button class="btn btn-ink" data-act="guardarOp" data-id="${id || ''}">Guardar</button>
  </div>`;
  $('#scrim').classList.remove('hidden'); requestAnimationFrame(() => { $('#scrim').classList.add('on'); $('#sheet').classList.add('on'); });
}

/* ---------- PIN contra la base (el PIN nunca baja al dispositivo) ---------- */
async function pinKeyNube(k) {
  if (k === 'c') pinBuf = pinBuf.slice(0, -1); else if (pinBuf.length < 4) pinBuf += k;
  if (pinBuf.length < 4) { renderLock(); return; }
  const pin = pinBuf; pinBuf = ''; renderLock();
  try {
    const r = await q(sb.rpc('verificar_pin', { p_club: nube.C, p_operador: pinSel, p_pin: pin }));
    if (r && r.length) { OP = { ...r[0], activo: true }; OP_PIN = pin; try { sessionStorage.setItem('padel.op', JSON.stringify(OP)); } catch (e) {} nube.log('Ingresó', OP.nombre); render(); return; }
  } catch (e) { toast(msgError(e)); }
  const d = $('#dots'); d.classList.remove('err'); void d.offsetWidth; d.classList.add('err');
}

/* ---------- Ajustes: dispositivos del club ---------- */
function bloqueDispositivos() {
  const L = DB.S.dispositivos || [];
  return `<div class="plate pad stack" style="margin-top:20px"><h2>Dispositivos activados</h2>
    <div class="muted" style="font-size:14px">Cada celular, tablet o PC se activa una sola vez con el código del club. Si se pierde uno, desactivalo acá.</div>
    <div class="lines">${L.map(x => `<div class="line"><div class="grow"><b>${esc(x.nombre)}</b><div class="sub">Activado ${fechaCorta(ms(x.creado))}${x.activo ? '' : ' · desactivado'}</div></div>
      <button class="btn ${x.activo ? 'btn-danger' : 'btn-line'} btn-sm" data-act="dispActivo" data-id="${x.user_id}" data-n="${esc(x.nombre)}" data-v="${x.activo ? '0' : '1'}">${x.activo ? 'Desactivar' : 'Reactivar'}</button></div>`).join('') || '<div class="muted">Ninguno todavía.</div>'}</div>
  </div>`;
}

/* ---------- arranque ---------- */
function INICIO() {
  if (MODO_DEMO) { DB.load(); restaurarSesion(); render(); return; }
  const base = estadoVacio(); base.dispositivos = [];
  try { const c = JSON.parse(localStorage.getItem('padel.nube.club') || 'null'); if (c) base.club = c; } catch (e) {}
  DB.usarNube(base);
  Object.assign(ACT, ACT_NUBE);
  const vAjustesLocal = vAjustes;
  vAjustes = () => vAjustesLocal() + bloqueDispositivos();
  nube.iniciar();
}

/* ---------- formularios propios (en lugar de las ventanitas del navegador, que algunos navegadores bloquean) ---------- */
let PEDIR = null;
function pedir(titulo, campos, o = {}) {
  return new Promise(res => {
    if (PEDIR) PEDIR.res(null);
    PEDIR = { res, campos, hoja: HOJA }; HOJA = null;
    const campo = c => c.tipo === 'check'
      ? `<label class="row" style="font-weight:600"><input type="checkbox" id="pd_${c.id}" ${c.valor ? 'checked' : ''} style="width:22px;height:22px"> ${esc(c.label)}</label>`
      : `<label class="f">${esc(c.label)}<input class="inp" id="pd_${c.id}" autocomplete="off" ${c.tipo === 'gs' ? 'inputmode="numeric" oninput="formatoMiles(this)"' : c.tipo === 'num' ? 'type="number" min="0" inputmode="numeric"' : ''} value="${esc(c.tipo === 'gs' ? (c.valor ? miles(c.valor) : '') : (c.valor ?? ''))}" placeholder="${esc(c.ph || '')}"></label>`;
    $('#sheet').innerHTML = `<div class="sheet-h"><h2>${esc(titulo)}</h2><button class="iconbtn" data-act="pedirNo" aria-label="Cerrar"><svg><use href="#i-x"/></svg></button></div>
      <div class="sheet-b">${o.texto ? `<p style="margin:0;font-size:17px">${esc(o.texto)}</p>` : ''}${campos.map(campo).join('')}
      <div class="row"><button class="btn ${o.peligro ? 'btn-danger' : 'btn-ink'}" data-act="pedirSi">${esc(o.boton || 'Guardar')}</button><button class="btn btn-line" data-act="pedirNo">Volver</button></div></div>`;
    $('#scrim').classList.remove('hidden'); requestAnimationFrame(() => { $('#scrim').classList.add('on'); $('#sheet').classList.add('on'); });
    $('#sheet').setAttribute('aria-hidden', 'false');
    setTimeout(() => { const i = $('#sheet').querySelector('input:not([type=checkbox])'); if (i) { i.focus(); if (i.select) i.select(); } }, 250);
  });
}
function cerrarPedir(valores) {
  const p = PEDIR; if (!p) return; PEDIR = null;
  if (p.hoja) { HOJA = p.hoja; renderHoja(); } else cerrarHoja();
  p.res(valores);
}
const confirmar = (texto, boton = 'Confirmar', peligro = true) => pedir('¿Confirmás?', [], { texto, boton, peligro }).then(v => !!v);
function formCancha(c) {
  return pedir(c ? 'Editar ' + c.nombre : 'Nueva cancha', [
    { id: 'n', label: 'Nombre', valor: c ? c.nombre : 'Cancha ' + (DB.S.canchas.length + 1) },
    { id: 'p', label: 'Precio por hora', tipo: 'gs', valor: c ? c.precio : 100000 },
    { id: 't', label: 'Es techada', tipo: 'check', valor: c ? c.techada : false }], { boton: c ? 'Guardar' : 'Agregar cancha' });
}
Object.assign(ACT, {
  pedirSi: () => {
    if (!PEDIR) return; const v = {};
    for (const c of PEDIR.campos) { const el = $('#pd_' + c.id); v[c.id] = c.tipo === 'check' ? el.checked : c.tipo === 'gs' ? num(el.value) : c.tipo === 'num' ? (el.value === '' ? null : +el.value) : el.value.trim(); }
    cerrarPedir(v);
  },
  pedirNo: () => cerrarPedir(null),
  cerrarHoja: () => (PEDIR ? cerrarPedir(null) : cerrarHoja())
});

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (f) { e.preventDefault(); f(b.dataset, b); }
});
document.addEventListener('change', e => {
  const k = e.target.dataset.in;
  if (k === 'fecha' && e.target.value) { FECHA = e.target.value; IR_AHORA = true; render(); if (DB.nube) nube.asegurarFecha(FECHA); }
  if (k === 'destino') { DESTINO = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#sheet').classList.contains('on')) ACT.cerrarHoja();
  if (e.key === 'Enter' && PEDIR && e.target.closest && e.target.closest('#sheet') && e.target.matches('input')) { e.preventDefault(); ACT.pedirSi(); }
  if (!$('#lock').classList.contains('hidden')) { if (/^\d$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') pinKey('c'); }
});
let tT; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('on'), 2600); }
// refresca la línea de "ahora" cada minuto sin tocar formularios abiertos
let DIA = hoyKey();
setInterval(() => {
  const h = hoyKey();
  if (h !== DIA) { if (FECHA === DIA) { FECHA = h; IR_AHORA = true; } DIA = h; if (DB.nube && nube.estado === 'ok') nube.asegurarFecha(FECHA); }
  if (OP && VISTA === 'agenda' && !HOJA && !document.activeElement?.matches('input,select')) render();
}, 60000);

INICIO();
</script>
